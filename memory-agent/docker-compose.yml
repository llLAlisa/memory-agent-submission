services:
  agent-memory:
    build: .
    container_name: agent-memory
    ports:
      - "8000:8000"
    volumes:
      - memory_data:/app/chroma_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  memory_data:
